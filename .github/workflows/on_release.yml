name: Generate Semantic Release
on:
  workflow_dispatch:
  push:
    branches:
      - version-14
      - version-15
      - version-16
jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Entire Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Setup dependencies
        run: |
          npm install @semantic-release/git @semantic-release/exec --no-save
      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.TIBA_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.TIBA_BOT_TOKEN }}
          GIT_AUTHOR_NAME: "Tiba PR Bot"
          GIT_AUTHOR_EMAIL: "devs@tiba.io"
          GIT_COMMITTER_NAME: "Tiba PR Bot"
          GIT_COMMITTER_EMAIL: "devs@tiba.io"
        run: npx semantic-release